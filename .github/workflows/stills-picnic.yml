name: Picnic QC stills
on:
  push:
    paths: ["picnic/stills.json"]
permissions:
  contents: write
concurrency:
  group: picnic-stills
  cancel-in-progress: true
jobs:
  stills:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          APT='-o Acquire::Retries=4 -o Acquire::http::Timeout=25 -o Acquire::ForceIPv4=true'
          for i in 1 2 3 4; do (sudo timeout 120 apt-get $APT update -q; sudo timeout 420 apt-get $APT install -y -q blender xvfb xauth ffmpeg libgl1-mesa-dri) && break; echo retry $i; sudo killall -q apt-get dpkg || true; sudo dpkg --configure -a || true; sudo sed -i -E 's#https?://[a-z0-9.-]*(archive|security)\.ubuntu\.com#http://archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true; done
          which blender
      - name: Link project path
        run: |
          sudo mkdir -p /home/claude
          sudo ln -sfn "$GITHUB_WORKSPACE/picnic" /home/claude/picnic
      - name: Stills
        run: python3 tools/gh_stills_picnic.py ${{ matrix.job }}
      - name: Push results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=stills/picnic-${{ github.run_id }}-j${{ matrix.job }}
          cd gh_out && git init -q && git checkout -q -b $B && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -qm "stills ${{ matrix.job }}" --allow-empty
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/$B
