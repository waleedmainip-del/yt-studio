name: Bargainer QC stills
on:
  push:
    paths: ["rich/stills.json"]
permissions:
  contents: write
concurrency:
  group: rich-stills
  cancel-in-progress: true
jobs:
  stills:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q blender xvfb xauth ffmpeg libgl1-mesa-dri
      - name: Link project path
        run: |
          sudo mkdir -p /home/claude
          sudo ln -sfn "$GITHUB_WORKSPACE/rich" /home/claude/rich
      - name: Stills
        run: python3 tools/gh_stills_rich.py ${{ matrix.job }}
      - name: Push results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=stills/rich-${{ github.run_id }}-j${{ matrix.job }}
          cd gh_out && git init -q && git checkout -q -b $B && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -qm "stills ${{ matrix.job }}" --allow-empty
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/$B
